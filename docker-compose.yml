# CateringPro - one command to run the whole portal:  docker compose up --build
# Portal: http://localhost:8080   API docs: http://localhost:3000/api/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catering
      POSTGRES_PASSWORD: catering
      POSTGRES_DB: catering
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catering"]
      interval: 3s
      retries: 20

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://catering:catering@db:5432/catering
      JWT_SECRET: change-me-in-production-please
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:8080
      APP_TIMEZONE: Africa/Cairo
      PORT: 3000
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]

  web:
    build: ./apps/web
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  dbdata:
