databases:
  - name: catering-db
    plan: free
    databaseName: catering
    user: catering

services:
  - type: web
    name: catering-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: catering-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        value: https://REPLACE-WITH-YOUR-VERCEL-DOMAIN.vercel.app
      - key: APP_TIMEZONE
        value: Africa/Cairo
